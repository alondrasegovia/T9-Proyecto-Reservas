{% extends "base.html" %}

{% block content %}
    <h2>✅ Reserva Confirmada</h2>
    <p>Gracias {{ reserva.usuario }} por reservar en Estrella de Atacama.</p>
    <p><b>{{ reserva.tipo|capitalize }}</b>: {{ reserva.item }}</p>
    <p>Precio: ${{ reserva.precio }} USD</p>
    <p>Confirmación enviada a: {{ reserva.email }}</p>
    <a href="{{ url_for('index') }}">Volver al inicio</a>
{% endblock %}
